<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>BPM / UFSC — Apresentação VR</title>

<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

<style>
html,body{
    margin:0;
    background:#08090c;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

#menu{
    max-width:1200px;
    margin:auto;
    padding:18px;
    text-align:center;
}

#preview{
    width:100%;
    max-height:72vh;
    object-fit:contain;
    background:white;
    border-radius:12px;
}

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    margin-top:15px;
    flex-wrap:wrap;
}

button{
    padding:14px 25px;
    font-size:18px;
    border-radius:10px;
    border:1px solid #666;
    background:#222;
    color:white;
    cursor:pointer;
}

#enterVR{
    background:#155f45;
}

#counter{
    font-size:20px;
    min-width:90px;
}

.info{
    color:#bbb;
    margin-top:12px;
}
</style>


<script>

/* =========================================================
   CELUBRAS / UFSC
   APRESENTAÇÃO VR — META QUEST
   ========================================================= */


/* ---------- COMPONENTE DOS BOTÕES VR ---------- */

AFRAME.registerComponent('slide-button', {

    schema:{
        action:{type:'string'}
    },

    init:function(){

        const el=this.el;

        const execute=()=>{

            if(this.data.action==="next"){
                nextSlide();
            }

            if(this.data.action==="prev"){
                previousSlide();
            }

        };

        el.addEventListener('click',execute);

        el.addEventListener('mouseenter',function(){
            el.setAttribute('scale','1.08 1.08 1.08');
        });

        el.addEventListener('mouseleave',function(){
            el.setAttribute('scale','1 1 1');
        });

    }

});


/* ---------- SLIDES ---------- */

const TOTAL_SLIDES = 14;

let currentSlide = 1;


/* ---------- CAMINHO DO SLIDE ---------- */

function slidePath(number){

    return "slides/slide" +
           String(number).padStart(2,"0") +
           ".jpg";

}


/* ---------- ATUALIZAR APRESENTAÇÃO ---------- */

function updateSlide(){

    const path = slidePath(currentSlide);

    const preview =
        document.getElementById("preview");

    if(preview){
        preview.src = path;
    }


    const screen =
        document.getElementById("vrScreen");

    if(screen){
        screen.setAttribute("src",path);
    }


    const counter =
        document.getElementById("counter");

    if(counter){
        counter.textContent =
            currentSlide + " / " + TOTAL_SLIDES;
    }


    const vrCounter =
        document.getElementById("vrCounter");

    if(vrCounter){
        vrCounter.setAttribute(
            "value",
            currentSlide + " / " + TOTAL_SLIDES
        );
    }

}


/* ---------- PRÓXIMO ---------- */

function nextSlide(){

    if(currentSlide < TOTAL_SLIDES){

        currentSlide++;

        updateSlide();

    }

}


/* ---------- ANTERIOR ---------- */

function previousSlide(){

    if(currentSlide > 1){

        currentSlide--;

        updateSlide();

    }

}


/* ---------- TECLADO ---------- */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key==="ArrowRight" ||
            event.key==="PageDown" ||
            event.key===" "
        ){
            nextSlide();
        }

        if(
            event.key==="ArrowLeft" ||
            event.key==="PageUp"
        ){
            previousSlide();
        }

    }
);


/* ---------- CONTROLADORES META QUEST ---------- */

AFRAME.registerComponent(
'quest-slide-controls',
{

    init:function(){

        this.el.addEventListener(
            'triggerdown',
            function(){
                nextSlide();
            }
        );

        this.el.addEventListener(
            'abuttondown',
            function(){
                nextSlide();
            }
        );

        this.el.addEventListener(
            'xbuttondown',
            function(){
                previousSlide();
            }
        );

    }

});


/* ---------- INICIALIZAÇÃO ---------- */

window.addEventListener(
    "load",
    function(){

        updateSlide();

        document
        .getElementById("prev")
        .onclick = previousSlide;

        document
        .getElementById("next")
        .onclick = nextSlide;


        document
        .getElementById("enterVR")
        .onclick = function(){

            const scene =
                document.querySelector("a-scene");

            scene.enterVR();

        };

    }
);

</script>

</head>


<body>


<!-- =====================================================
     MODO NORMAL
     ===================================================== -->

<div id="menu">

<h2>
Projeto PR — BPM / UFSC
</h2>

<p>
Reaproveitamento de Resíduos Industriais
</p>


<img
id="preview"
src="slides/slide01.jpg"
alt="Apresentação BPM UFSC">


<div class="controls">

<button id="prev">
◀ ANTERIOR
</button>

<span id="counter">
1 / 14
</span>

<button id="next">
PRÓXIMO ▶
</button>

<button id="enterVR">
ENTRAR EM VR
</button>

</div>


<div class="info">

Meta Quest:
use as mãos ou os controladores para selecionar
ANTERIOR e PRÓXIMO.

<br>

Teclado:
← / → também controlam os slides.

</div>

</div>

bounded-floor,

<!-- =====================================================

<a-box

height="0.9"

color="#30343b">

<a-text
value="<  ANTERIOR"

<!-- =====================================================

<a-box

width="13"

</a-box>

width="13"

<a-sphere position="-1.35 1.15 0" radius=".24" color="#050505"></a-sphere>
<a-cylinder position="-1.35 .65 0" radius=".30" height=".75" color="#050505"></a-cylinder>

<a-sphere position="1.35 1.15 0" radius=".24" color="#050505"></a-sphere>
<a-cylinder position="1.35 .65 0" radius=".30" height=".75" color="#050505"></a-cylinder>

<a-sphere position="2.7 1.15 0" radius=".24" color="#050505"></a-sphere>
<a-cylinder position="2.7 .65 0" radius=".30" height=".75" color="#050505"></a-cylinder>
